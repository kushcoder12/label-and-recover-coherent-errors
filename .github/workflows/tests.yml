name: tests

on:
  push:
  pull_request:

jobs:
  reference-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy matplotlib
      - run: python tests/run_all.py

  pennylane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r pennylane_impl/requirements.txt
      - run: python -m pytest pennylane_impl/tests -q
